[workspace]
resolver = "2"
members = ["doc-cli", "doc-core", "doc-run", "doc-shot", "doc-store", "doc-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/doc-platform/doc"

# Optimise the compiled artifacts: small, fast binaries and wasm.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
