[package]
name = "doc-wasm"
description = "WebAssembly bindings for doc-core: the same Rust DOCSRC parser, binary codec, compressor, digest, and search index, exposed to JavaScript so the editor and the backend share one parser."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The bundled wasm-opt is older than the ops LLVM now emits by default — bulk memory, and
# the non-trapping float-to-int conversions a saturating `f64 as u32` compiles to; enable
# both so the optimizer accepts (and keeps optimizing) the module.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dependencies]
doc-core = { path = "../doc-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
