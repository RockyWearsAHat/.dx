[package]
name = "doc-native"
description = "Native MCP server shell for the DOC platform: a stdio JSON-RPC 2.0 protocol layer that exposes document operations to AI agents. Wraps a DocStore implementation (real doc-core wiring or an in-memory stub)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "doc-native"
path = "src/main.rs"

[dependencies]
doc-core = { path = "../doc-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
